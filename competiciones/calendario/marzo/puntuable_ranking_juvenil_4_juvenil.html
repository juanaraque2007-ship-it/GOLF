<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IV Puntuable Ranking Juvenil de Castilla La Mancha</title>
    <link rel="icon" type="image/png" href="../../../img/favicon_pagina.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../shared.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['class', '.a11y-dark-mode'],
        theme: {
          extend: {
            colors: {
              'green-dark': '#1A4331',
              'gold': '#C9A84C',
            },
            fontFamily: {
              'serif': ['"Playfair Display"', 'serif'],
              'sans': ['"DM Sans"', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="font-sans antialiased text-gray-800 bg-gray-50 dark:bg-[#060f0b] pt-[70px]">

    <!-- Navegación inyectada via shared.js -->

    <!-- Hero Section -->
    <div class="relative bg-gradient-to-r from-green-dark to-[#2E7A5A] py-16 px-6 text-center flex flex-col items-center justify-center min-h-[300px] overflow-hidden">
        <!-- Puedes añadir una imagen de fondo aquí si lo deseas cambiando el bg-none -->
        <div class="absolute inset-0 opacity-20 bg-center bg-cover" style="background-image: url('../../../img/hero-bg.jpg');"></div>
        <div class="relative z-10 max-w-4xl mx-auto">
            <div class="text-gold font-bold tracking-[2px] uppercase text-sm mb-4">Calendario</div>
            <h1 class="text-4xl md:text-5xl font-serif text-white font-bold mb-4">
                <em class="not-italic text-gold">IV Puntuable Ranking Juvenil de Castilla La Mancha</em>
            </h1>
        </div>
    </div>

    <!-- Content Section -->
    <div class="py-16 px-6 md:px-24 max-w-[900px] mx-auto min-h-[50vh] flex items-start justify-center">
        <div class="bg-white dark:bg-[#0d1f18] border border-gray-100 dark:border-[#1e3e30] rounded-xl p-8 md:p-12 text-center shadow-[0_4px_20px_rgba(0,0,0,0.03)] w-full">
            <div class="text-gold mb-6 flex justify-center">
                <!-- Icono representativo (torneo/calendario) -->
                <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="12" y="16" width="40" height="36" rx="4" ry="4"></rect>
                    <line x1="20" y1="10" x2="20" y2="22"></line>
                    <line x1="44" y1="10" x2="44" y2="22"></line>
                    <line x1="12" y1="28" x2="52" y2="28"></line>
                </svg>
            </div>
            
            <h2 class="font-serif text-2xl md:text-3xl text-green-dark dark:text-[#e8f0ec] mb-8">Información del Campeonato</h2>
            
            <div class="flex flex-col sm:flex-row items-center justify-center gap-8 text-lg text-gray-600 dark:text-[#9cb5a8] mb-8">
                <div class="flex items-center gap-3">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gold">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span class="dark:text-[#e8f0ec]">31 de marzo de 2026</span>
                </div>
                <div class="flex items-center gap-3">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gold">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span class="font-medium text-green-dark dark:text-[#e8f0ec]">Olalla Golf</span>
                </div>
            </div>
        </div>
    </div>

    <script src="../../../shared.js"></script>
</body>
</html>
